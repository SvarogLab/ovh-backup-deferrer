name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  rust:
    uses: SvarogLab/.github/.github/workflows/rust.yml@v3.2
    with:
      binaries: ovh-autobackup-deferrer

  helm:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5

      - name: helm lint
        run: helm lint helm --strict --set credentialsSecret=ci --set services[0].name=vps-a.example --set services[0].offset=0

  image-check:
    if: github.event_name == 'pull_request'
    uses: SvarogLab/.github/.github/workflows/image.yml@v3.2
    permissions:
      contents: read
      packages: write
    with:
      push: false
      binaries: ovh-autobackup-deferrer

  tag:
    needs: [rust, helm]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: SvarogLab/.github/.github/workflows/tag-release.yml@v3.2
    permissions:
      contents: write

  image:
    needs: tag
    if: needs.tag.outputs.tag != ''
    uses: SvarogLab/.github/.github/workflows/image.yml@v3.2
    permissions:
      contents: read
      packages: write
    with:
      tag: ${{ needs.tag.outputs.tag }}

  chart:
    needs: [tag, image]
    uses: SvarogLab/.github/.github/workflows/chart.yml@v3.2
    permissions:
      contents: read
      packages: write
    with:
      tag: ${{ needs.tag.outputs.tag }}

  release:
    needs: [tag, chart]
    uses: SvarogLab/.github/.github/workflows/release.yml@v3.2
    permissions:
      contents: write
    with:
      tag: ${{ needs.tag.outputs.tag }}
      download-chart: true

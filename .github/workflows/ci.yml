name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  rust:
    uses: SvarogLab/.github/.github/workflows/rust.yml@v1

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5

      - name: helm lint
        run: helm lint helm --strict --set credentialsSecret=ci --set services[0].name=vps-a.example --set services[0].offset=0

  image:
    needs: [rust, helm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: env.RELEASE == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: type=semver,pattern={{version}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ env.RELEASE == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    needs: [rust, helm]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5

      # The tag is the one version source for both artifacts, so the chart and its default image
      # tag cannot drift from the image this run publishes.
      - name: package and push
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          helm package helm --version "$version" --app-version "$version"
          echo "$TOKEN" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm push "ovh-autobackup-deferrer-$version.tgz" "oci://ghcr.io/${{ github.repository }}"
